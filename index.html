<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor Fatiga y Distracción</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      color: #2c3e50;
      font-size: 14px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #018A80 0%, #016d65 100%);
      color: white;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    .header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    #btnCheck {
      background: white;
      color: #018A80;
      border: none;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: all 0.2s;
    }
    #btnCheck:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    #btnCheck:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .badge-group {
      background: rgba(255,255,255,0.25);
      color: white;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .container { padding: 16px 20px; }

    /* ── Status bar ── */
    .status-bar {
      background: white;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0,0,0,0.07);
      font-size: 12px;
      color: #666;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-ok    { background: #27ae60; }
    .dot-warn  { background: #e67e22; }
    .dot-error { background: #e74c3c; }
    .dot-loading { background: #018A80; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Alert banner ── */
    .alert-banner {
      background: #fff0f0;
      border-left: 4px solid #e74c3c;
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 10px;
    }
    .alert-banner .alert-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; color: #c0392b; }
    .alert-banner .alert-detail { font-size: 12px; color: #666; }

    /* ── Stat cards ── */
    .stats-row { display: flex; gap: 14px; margin-bottom: 16px; }
    .stat-card {
      flex: 1;
      border-radius: 10px;
      padding: 16px 18px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.12);
      color: white;
    }
    .stat-card.teal  { background: linear-gradient(135deg, #018A80, #01b4a6); }
    .stat-card.blue  { background: linear-gradient(135deg, #2980b9, #3498db); }
    .stat-card.red   { background: linear-gradient(135deg, #c0392b, #e74c3c); }
    .stat-card .stat-value { font-size: 32px; font-weight: 800; }
    .stat-card .stat-label { font-size: 11px; opacity: 0.9; margin-top: 4px; }

    /* ── Table ── */
    .table-section {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    .table-header {
      padding: 12px 16px;
      font-weight: 600;
      font-size: 13px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #444;
    }
    .filter-input {
      border: 1px solid #ddd;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      outline: none;
      width: 180px;
    }
    .filter-input:focus { border-color: #018A80; }

    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #018A80;
      color: white;
      padding: 11px 14px;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.15s; }
    tbody tr:hover { background: #f8fffe; }
    tbody tr.row-alert { background: #fff5f5; }
    tbody tr.row-alert:hover { background: #ffeeee; }
    tbody td { padding: 10px 14px; font-size: 13px; }

    .tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
    }
    .tag-ok   { background: #d5f5e3; color: #1a7a3c; }
    .tag-alert{ background: #fce4e4; color: #c0392b; }
    .tag-warn { background: #fef3cd; color: #856404; }

    .count-cell { font-weight: 700; font-size: 15px; }
    .count-alert{ color: #e74c3c; }
    .count-warn { color: #e67e22; }
    .count-ok   { color: #27ae60; }

    .empty-state { text-align: center; padding: 40px 20px; color: #aaa; font-size: 13px; }
    .empty-state .icon { font-size: 36px; margin-bottom: 8px; }

    .email-sent-badge {
      background: #d5f5e3; color: #1a7a3c;
      padding: 2px 8px; border-radius: 10px;
      font-size: 10px; font-weight: 600;
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #ccc;
      border-top-color: #018A80;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 600px) {
      .stats-row { flex-wrap: wrap; }
      .stat-card { min-width: calc(50% - 7px); }
    }
  </style>
</head>
<body>

<!-- CONFIGURACIÓN -->
<script>
var ADDIN_CONFIG = {
  groupName:       'LHRMXCO',
  database:        'lhmrxco',
  alertThreshold:  10,
  timeWindowHours: 1,
  refreshMinutes:  5,
  targetEmail:     'jcamargo@navisaf.com',
  emailjs: {
    publicKey:  'w0qHujgXAi0v9CJkH',
    serviceId:  'service_9jj0dzl',
    templateId: 'template_pkr52on'
  },
  eventKeywords: [
    'distraíd','distraida','distracted','distraccion','distracción',
    'celular','telefono','teléfono','phone','cellphone','movil','móvil',
    'bostezo','yawn','somnolencia','drowsy','microsueño','fatiga','fatigue',
    'surfsight'
  ]
};
</script>

<!-- Header -->
<div class="header">
  <h1>🚨 Monitor Fatiga y Distracción</h1>
  <div class="header-right">
    <span class="badge-group">📁 <span id="lblGroup">LHRMXCO</span></span>
    <button id="btnCheck" onclick="runCheck()">▶ Verificar ahora</button>
  </div>
</div>

<div class="container">

  <div class="status-bar">
    <div id="statusMsg">
      <span class="status-dot dot-ok"></span>Listo — presiona "Verificar ahora"
    </div>
    <div id="lastCheck" style="color:#aaa;">—</div>
  </div>

  <div id="alertsContainer"></div>

  <div class="stats-row">
    <div class="stat-card teal">
      <div class="stat-value" id="statTotal">—</div>
      <div class="stat-label">Eventos totales (última hora)</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-value" id="statVehicles">—</div>
      <div class="stat-label">Vehículos con eventos</div>
    </div>
    <div class="stat-card red">
      <div class="stat-value" id="statAlerts">—</div>
      <div class="stat-label">Vehículos en alerta (≥10)</div>
    </div>
  </div>

  <div class="table-section">
    <div class="table-header">
      <span>Detalle por vehículo</span>
      <input type="text" class="filter-input" id="tableFilter"
             placeholder="🔍 Buscar vehículo..." oninput="filterTable()" />
    </div>
    <div id="tableContainer">
      <div class="empty-state">
        <div class="icon">📡</div>
        Presiona "Verificar ahora" para consultar los eventos
      </div>
    </div>
  </div>

</div>

<!-- ADD-IN LOGIC -->
<script>
(function() {
  'use strict';

  var geotabApi    = null;
  var refreshTimer = null;
  var tableData    = [];
  var alertsSent   = {};
  var ruleCache    = {};
  var groupId      = null;

  if (!window.geotab)       { window.geotab = {}; }
  if (!window.geotab.addin) { window.geotab.addin = {}; }

  window.geotab.addin.monitorFatigaDistraccion = function(api, state) {
    geotabApi = api;
    return {
      initialize: function(freshApi, freshState, callback) {
        geotabApi = freshApi;
        if (window.emailjs) { emailjs.init(ADDIN_CONFIG.emailjs.publicKey); }
        callback();
      },
      focus: function(freshApi, freshState) {
        geotabApi = freshApi;
        document.getElementById('lblGroup').textContent = ADDIN_CONFIG.groupName;
        resolveGroupId(function() { runCheck(); startAutoRefresh(); });
      },
      blur: function() { stopAutoRefresh(); }
    };
  };

  function resolveGroupId(callback) {
    if (groupId) { callback(); return; }
    geotabApi.call('Get', { typeName: 'Group', search: {} },
      function(groups) {
        var match = (groups || []).find(function(g) {
          return g.name && g.name.toLowerCase() === ADDIN_CONFIG.groupName.toLowerCase();
        });
        if (match) { groupId = match.id; callback(); }
        else { setStatus('error', 'Grupo "' + ADDIN_CONFIG.groupName + '" no encontrado.'); }
      },
      function(err) {
        setStatus('error', 'Error al obtener grupos: ' + (err.message || err));
      }
    );
  }

  function startAutoRefresh() {
    stopAutoRefresh();
    refreshTimer = setInterval(function() { resolveGroupId(runCheck); }, ADDIN_CONFIG.refreshMinutes * 60000);
  }
  function stopAutoRefresh() {
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
  }

  window.runCheck = function() {
    if (!geotabApi) { return; }
    setStatus('loading', 'Consultando eventos...');
    document.getElementById('btnCheck').disabled = true;

    var now      = new Date();
    var fromDate = new Date(now.getTime() - ADDIN_CONFIG.timeWindowHours * 3600000);

    geotabApi.call('Get', {
      typeName: 'ExceptionEvent',
      search: {
        fromDate: fromDate.toISOString(),
        toDate:   now.toISOString(),
        deviceSearch: { groups: [{ id: groupId }] }
      }
    },
    function(events) {
      if (!events || events.length === 0) {
        setStatus('ok', 'Sin eventos en la última hora');
        updateStats(0, 0, 0); renderTable([]); clearAlerts();
        document.getElementById('btnCheck').disabled = false;
        updateLastCheck(now); return;
      }

      var uncached = [];
      events.forEach(function(e) {
        if (e.rule && e.rule.id && !ruleCache[e.rule.id] && uncached.indexOf(e.rule.id) === -1)
          uncached.push(e.rule.id);
      });

      if (uncached.length === 0) { processEvents(events, now); return; }

      geotabApi.call('Get', { typeName: 'ExceptionRule', search: {} },
        function(rules) {
          (rules || []).forEach(function(r) { ruleCache[r.id] = r.name || ''; });
          processEvents(events, now);
        },
        function() { processEvents(events, now); }
      );
    },
    function(err) {
      setStatus('error', 'Error Geotab: ' + (err.message || err));
      document.getElementById('btnCheck').disabled = false;
    });
  };

  function processEvents(events, checkTime) {
    var filtered = events.filter(function(e) {
      var rn = (ruleCache[e.rule && e.rule.id] || '').toLowerCase();
      return ADDIN_CONFIG.eventKeywords.some(function(kw) { return rn.indexOf(kw.toLowerCase()) !== -1; });
    });

    var byDevice = {};
    filtered.forEach(function(e) {
      var devId = e.device && e.device.id;
      if (!devId) return;
      if (!byDevice[devId]) byDevice[devId] = {
        deviceId: devId, deviceName: '', total: 0,
        counts: { distraccion: 0, celular: 0, bostezo: 0, otros: 0 }
      };
      byDevice[devId].total++;
      var rn = (ruleCache[e.rule && e.rule.id] || '').toLowerCase();
      if (['distraíd','distraida','distracted','distraccion','distracción'].some(function(k){return rn.indexOf(k)!==-1;}))
        byDevice[devId].counts.distraccion++;
      else if (['celular','telefono','teléfono','phone','cellphone','movil','móvil'].some(function(k){return rn.indexOf(k)!==-1;}))
        byDevice[devId].counts.celular++;
      else if (['bostezo','yawn','somnolencia','drowsy','microsueño','fatiga','fatigue'].some(function(k){return rn.indexOf(k)!==-1;}))
        byDevice[devId].counts.bostezo++;
      else
        byDevice[devId].counts.otros++;
    });

    var deviceIds = Object.keys(byDevice);
    if (deviceIds.length === 0) {
      setStatus('ok', 'Sin eventos coincidentes en la última hora');
      updateStats(events.length, 0, 0); renderTable([]); clearAlerts();
      document.getElementById('btnCheck').disabled = false; updateLastCheck(checkTime); return;
    }

    geotabApi.call('Get', { typeName: 'Device', search: { groups: [{ id: groupId }] } },
      function(devices) {
        var nameMap = {};
        (devices || []).forEach(function(d) { nameMap[d.id] = d.name || d.id; });
        deviceIds.forEach(function(id) { byDevice[id].deviceName = nameMap[id] || id; });

        tableData = deviceIds.map(function(id) { return byDevice[id]; });
        tableData.sort(function(a, b) { return b.total - a.total; });

        var alertVehicles = tableData.filter(function(v) { return v.total >= ADDIN_CONFIG.alertThreshold; });
        updateStats(filtered.length, tableData.length, alertVehicles.length);
        renderTable(tableData);
        renderAlerts(alertVehicles, checkTime);

        alertVehicles.forEach(function(v) {
          var last = alertsSent[v.deviceId];
          if (!last || (Date.now() - last) > 3600000) {
            sendAlertEmail(v, checkTime);
            alertsSent[v.deviceId] = Date.now();
          }
        });

        var msg = alertVehicles.length > 0
          ? ('⚠ ' + alertVehicles.length + ' vehículo(s) superan el umbral de ' + ADDIN_CONFIG.alertThreshold + ' eventos')
          : 'OK — ningún vehículo supera el umbral';
        setStatus(alertVehicles.length > 0 ? 'warn' : 'ok', msg);
        document.getElementById('btnCheck').disabled = false;
        updateLastCheck(checkTime);
      },
      function() {
        deviceIds.forEach(function(id) { byDevice[id].deviceName = id; });
        tableData = deviceIds.map(function(id) { return byDevice[id]; });
        tableData.sort(function(a, b) { return b.total - a.total; });
        renderTable(tableData);
        setStatus('ok', 'Listo (sin nombres de vehículos)');
        document.getElementById('btnCheck').disabled = false;
        updateLastCheck(checkTime);
      }
    );
  }

  function renderTable(data) {
    var container = document.getElementById('tableContainer');
    if (data.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">✅</div>Sin eventos en la última hora</div>';
      return;
    }
    var rows = data.map(function(v) {
      var isAlert = v.total >= ADDIN_CONFIG.alertThreshold;
      var isWarn  = v.total >= Math.floor(ADDIN_CONFIG.alertThreshold * 0.7) && !isAlert;
      var countClass = isAlert ? 'count-alert' : (isWarn ? 'count-warn' : 'count-ok');
      var tag = isAlert
        ? '<span class="tag tag-alert">🚨 ALERTA</span>'
        : (isWarn ? '<span class="tag tag-warn">⚠ Atención</span>' : '<span class="tag tag-ok">✔ OK</span>');
      var emailBadge = alertsSent[v.deviceId] ? ' <span class="email-sent-badge">📧 Correo enviado</span>' : '';
      return '<tr class="' + (isAlert ? 'row-alert' : '') + '" data-name="' + escHtml(v.deviceName.toLowerCase()) + '">'
        + '<td><strong>' + escHtml(v.deviceName) + '</strong></td>'
        + '<td class="count-cell ' + countClass + '">' + v.total + '</td>'
        + '<td>' + v.counts.distraccion + '</td>'
        + '<td>' + v.counts.celular + '</td>'
        + '<td>' + v.counts.bostezo + '</td>'
        + '<td>' + tag + emailBadge + '</td>'
        + '</tr>';
    }).join('');
    container.innerHTML = '<table>'
      + '<thead><tr><th>Vehículo</th><th>Total eventos</th>'
      + '<th>Conducción distraída</th><th>Uso de celular</th>'
      + '<th>Bostezo / Somnolencia</th><th>Estado</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table>';
  }

  window.filterTable = function() {
    var q = document.getElementById('tableFilter').value.toLowerCase();
    document.querySelectorAll('#tableContainer tbody tr').forEach(function(r) {
      r.style.display = (!q || r.dataset.name.indexOf(q) !== -1) ? '' : 'none';
    });
  };

  function renderAlerts(vehicles, time) {
    var container = document.getElementById('alertsContainer');
    container.innerHTML = '';
    vehicles.forEach(function(v) {
      var div = document.createElement('div');
      div.className = 'alert-banner';
      div.innerHTML = '<div class="alert-title">🚨 ALERTA — ' + escHtml(v.deviceName) + '</div>'
        + '<div class="alert-detail">' + v.total + ' eventos en la última hora'
        + ' (Distraído: ' + v.counts.distraccion
        + ' | Celular: ' + v.counts.celular
        + ' | Bostezo: ' + v.counts.bostezo + ')'
        + ' — ' + formatTime(time) + '</div>';
      container.appendChild(div);
    });
  }
  function clearAlerts() { document.getElementById('alertsContainer').innerHTML = ''; }

  function sendAlertEmail(vehicle, time) {
    if (!window.emailjs) { return; }
    emailjs.send(ADDIN_CONFIG.emailjs.serviceId, ADDIN_CONFIG.emailjs.templateId, {
      to_email: ADDIN_CONFIG.targetEmail, vehicle_name: vehicle.deviceName,
      total_events: vehicle.total, distraido: vehicle.counts.distraccion,
      celular: vehicle.counts.celular, bostezo: vehicle.counts.bostezo,
      time_window: ADDIN_CONFIG.timeWindowHours + ' hora(s)',
      check_time: formatTime(time), group: ADDIN_CONFIG.groupName
    }).then(function() { renderTable(tableData); })
      .catch(function(err) { console.error('EmailJS error:', err); });
  }

  function setStatus(type, msg) {
    var dotClass = { ok:'dot-ok', warn:'dot-warn', error:'dot-error', loading:'dot-loading' }[type] || 'dot-ok';
    var prefix = type === 'loading'
      ? '<span class="spinner"></span>'
      : '<span class="status-dot ' + dotClass + '"></span>';
    document.getElementById('statusMsg').innerHTML = prefix + msg;
  }
  function updateStats(total, vehicles, alerts) {
    document.getElementById('statTotal').textContent    = total;
    document.getElementById('statVehicles').textContent = vehicles;
    document.getElementById('statAlerts').textContent   = alerts;
  }
  function updateLastCheck(time) {
    document.getElementById('lastCheck').textContent = 'Última revisión: ' + formatTime(time);
  }
  function formatTime(d) {
    return d.toLocaleDateString('es-MX') + ' ' + d.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
  }
  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

})();
</script>

</body>
</html>
